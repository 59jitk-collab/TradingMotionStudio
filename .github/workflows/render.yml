
name: Render SMC Trading Reel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render src/index.ts SMCVideo out/SMC-Blue-Reel.mp4 --codec h264 --crf 20 --concurrency 2

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: SMC-Blue-Reel
          path: out/SMC-Blue-Reel.mp4
          retention-days: 7
          
